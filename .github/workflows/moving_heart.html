<!DOCTYPE html>
<html>
<head>
    <title>Moving Heart Animation ❤️</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .heart {
            position: absolute;
            font-size: 100px;
            animation: moveHeart 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255,0,0,0.5));
        }
        
        @keyframes moveHeart {
            0% {
                left: -100px;
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                transform: scale(1.2) rotate(15deg);
            }
            100% {
                left: calc(100% + 100px);
                transform: scale(0.5) rotate(360deg);
            }
        }
        
        .heart:nth-child(1) { animation-delay: 0s; top: 20%; }
        .heart:nth-child(2) { animation-delay: 0.5s; top: 40%; font-size: 80px; }
        .heart:nth-child(3) { animation-delay: 1s; top: 60%; font-size: 120px; }
        .heart:nth-child(4) { animation-delay: 1.5s; top: 80%; font-size: 90px; }
        .heart:nth-child(5) { animation-delay: 2s; top: 30%; font-size: 70px; }
        .heart:nth-child(6) { animation-delay: 2.5s; top: 70%; font-size: 110px; }
        
        .message {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: fadeIn 2s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        button {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 18px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s;
            z-index: 10;
        }
        
        button:hover {
            transform: translateX(-50%) scale(1.05);
        }
        
        .title {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">❤️ Watch the Hearts Move! ❤️</div>
        
        <div class="heart">❤️</div>
        <div class="heart">❤️</div>
        <div class="heart">❤️</div>
        <div class="heart">❤️</div>
        <div class="heart">❤️</div>
        <div class="heart">❤️</div>
        
        <div class="message">Sending love from one end to another! 💕</div>
        
        <button onclick="addMoreHearts()">Add More Hearts! ❤️</button>
    </div>
    
    <script>
        function addMoreHearts() {
            const container = document.querySelector('.container');
            const newHeart = document.createElement('div');
            newHeart.className = 'heart';
            newHeart.innerHTML = '❤️';
            newHeart.style.top = Math.random() * 80 + 10 + '%';
            newHeart.style.fontSize = Math.random() * 80 + 50 + 'px';
            newHeart.style.animation = 'moveHeart 3s ease-in-out';
            container.appendChild(newHeart);
            
            // Remove after animation
            setTimeout(() => {
                newHeart.remove();
            }, 3000);
        }
    </script>
</body>
</html>
